<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
	<meta name="theme-color" content="#0A0B0E">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="TFC Ops Hub">
	<meta name="description" content="Track and manage TFC food production orders in real time">
	<meta property="og:title" content="TFC Ops Hub">
	<meta property="og:description" content="Track and manage TFC food production orders in real time">
	<meta property="og:type" content="website">
	<meta property="og:image" content="/icon-512.png">
	<meta name="twitter:card" content="summary">
	<link rel="manifest" href="%PUBLIC_URL%/manifest.json">
	<link rel="shortcut icon" href="%PUBLIC_URL%/icon-192.png">
	<link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png">
	<title>TFC Ops Hub</title>

	<!-- Early connection to Firebase/Google so requests start before JS loads -->
	<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
	<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
	<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
	<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
	<link rel="preconnect" href="https://fcmregistrations.googleapis.com" crossorigin>
	<link rel="dns-prefetch" href="https://fonts.googleapis.com">
	<link rel="dns-prefetch" href="https://firebase.googleapis.com">

	<!-- Inline shell so the screen is dark immediately (no white flash) while the JS bundle loads -->
	<style>
		*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
		html,body{height:100%;background:#0A0B0E;color:#F4F4F5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
		#root{min-height:100vh}
		#app-shell{
			position:fixed;inset:0;display:flex;flex-direction:column;
			align-items:center;justify-content:center;background:#0A0B0E;
			z-index:9999;transition:opacity 0.3s ease;
		}
		#app-shell.hidden{opacity:0;pointer-events:none}
		.shell-logo{
			width:72px;height:72px;border-radius:50%;
			background:#BE123C;display:flex;align-items:center;justify-content:center;
			margin-bottom:20px;box-shadow:0 0 32px rgba(190,18,60,0.5);
		}
		.shell-logo svg{width:36px;height:36px;fill:#F4F4F5}
		.shell-title{font-size:1.1rem;font-weight:600;color:#F4F4F5;letter-spacing:0.05em;margin-bottom:6px}
		.shell-sub{font-size:0.78rem;color:rgba(255,255,255,0.45);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:28px}
		.shell-bar{width:160px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden}
		.shell-bar::after{
			content:'';display:block;height:100%;width:40%;background:#BE123C;border-radius:2px;
			animation:shell-slide 1.4s ease-in-out infinite;
		}
		@keyframes shell-slide{
			0%{transform:translateX(-100%)}
			50%{transform:translateX(300%)}
			100%{transform:translateX(300%)}
		}
		@media(prefers-reduced-motion:reduce){.shell-bar::after{animation:none;width:100%}}
	</style>
</head>

<body>
	<noscript>You need to enable JavaScript to run this app.</noscript>

	<!-- Visible immediately before React mounts — gives instant feedback on slow connections -->
	<div id="app-shell" aria-hidden="true">
		<div class="shell-logo">
			<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
				<path d="M11 2v2.07A8.002 8.002 0 0 0 4.07 11H2v2h2.07A8.002 8.002 0 0 0 11 19.93V22h2v-2.07A8.002 8.002 0 0 0 19.93 13H22v-2h-2.07A8.002 8.002 0 0 0 13 4.07V2h-2zm1 4a6 6 0 1 1 0 12A6 6 0 0 1 12 6zm0 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>
			</svg>
		</div>
		<div class="shell-title">TFC Ops Hub</div>
		<div class="shell-sub">Loading</div>
		<div class="shell-bar"></div>
	</div>

	<div id="root"></div>

	<script>
		// Hide the shell once React has mounted
		(function(){
			var obs = new MutationObserver(function(){
				var root = document.getElementById('root');
				if(root && root.children.length > 0){
					var shell = document.getElementById('app-shell');
					if(shell){ shell.classList.add('hidden'); setTimeout(function(){ shell.remove(); }, 350); }
					obs.disconnect();
				}
			});
			obs.observe(document.getElementById('root'), {childList:true});
		})();
	</script>
</body>

</html>
