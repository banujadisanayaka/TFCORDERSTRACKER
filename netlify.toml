[build]
  publish = "build"
  command = "npm run build"

[build.environment]
  CI = "false"
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  directory = "netlify/functions"
  node_bundler = "zisi"
  included_files = ["node_modules/firebase-admin/**"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
